<text x="216" y="231" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="400" fill="#426074">Secret + runtime ready</text>
<rect x="78" y="355" width="276" height="100" rx="13" fill="#e7f2fb" stroke="#397da7" stroke-width="2"/>
