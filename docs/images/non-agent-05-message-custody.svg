<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Telegram 回复不是一次 send_message：接纳、执行、投递分离">
<title>Telegram 回复不是一次 send_message：接纳、执行、投递分离</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547287"/></marker></defs>
<rect width="1200" height="630" fill="#f8fafc"/>
<text x="40" y="53" fill="#17354a" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="600">Telegram 回复不是一次 send_message：接纳、执行、投递分离</text>
