<polyline points="985,264 985,355" fill="none" stroke="#547287" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="606" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#647b8a">HTTP 200 ≠ Agent 已做事；Todo 已提交 ≠ Telegram 已确认送达。</text>
