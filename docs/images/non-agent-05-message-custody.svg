<text x="600" y="231" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="400" fill="#426074">租约与 fence 防旧 Worker</text>
<rect x="461" y="355" width="278" height="100" rx="13" fill="#e8f5ec" stroke="#438a61" stroke-width="2"/>
<text x="600" y="387" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="19" font-weight="600" fill="#17354a">执行业务并留证明</text>
<text x="600" y="416" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="400" fill="#426074">Agent/Saver 与业务状态</text>
