<text x="995" y="230" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="400" fill="#426074">业务用户 UUID / Telegram ID</text>
<rect x="858" y="313" width="275" height="85" rx="13" fill="#f0ebfa" stroke="#8065ad" stroke-width="2"/>
<text x="995" y="345" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="19" font-weight="600" fill="#17354a">launch tickets</text>
<text x="995" y="374" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="400" fill="#426074">Bot、Telegram 用户、10 分钟</text>
<rect x="858" y="433" width="275" height="85" rx="13" fill="#f0ebfa" stroke="#8065ad" stroke-width="2"/>
<text x="995" y="465" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="19" font-weight="600" fill="#17354a">web sessions</text>
<text x="995" y="494" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="400" fill="#426074">User、CSRF、过期与撤销</text>
<polyline points="203,265 203,347" fill="none" stroke="#547287" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="337,406 854,211" fill="none" stroke="#547287" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="734,210 853,347" fill="none" stroke="#547287" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="734,407 853,476" fill="none" stroke="#547287" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="606" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#647b8a">两条入口共享 User.id；模型既不能声明身份，也不能直接签发 Session。</text>
</svg>
